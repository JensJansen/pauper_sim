<title>Training Ops</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.4 -apple-system, Segoe UI, sans-serif;
    background: #14161a; color: #d8dbe0;
  }
  header { padding: 14px 20px; border-bottom: 1px solid #2a2d33; display: flex; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0 12px; color: #888; font-size: 12px; }
  header a { margin-left: auto; color: #6a9dff; text-decoration: none; font-size: 12px; }
  header a:hover { text-decoration: underline; }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  section { background: #1b1e24; border: 1px solid #2a2d33; border-radius: 8px; padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #9aa0aa; }
  label { display: block; font-size: 12px; color: #aab; margin: 10px 0 3px; }
  label.checkbox { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; }
  label.checkbox input { margin: 0; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 6px 8px; background: #0e1013;
    border: 1px solid #34383f; border-radius: 5px; color: #e8eaf0; font-size: 13px;
  }
  .matchup-row { display: flex; gap: 8px; }
  .matchup-row input { flex: 1; }
  .hint { font-size: 11px; color: #666; margin-top: 4px; }
  button {
    cursor: pointer; border: 1px solid #3a3f47; border-radius: 5px; background: #262a31;
    color: #e8eaf0; padding: 6px 12px; font-size: 12px;
  }
  button:hover { background: #2f343c; }
  button.primary { background: #3a6df0; border-color: #3a6df0; color: #fff; width: 100%; margin-top: 14px; padding: 9px; font-size: 13px; }
  button.primary:hover { background: #4a7cff; }
  button.danger { background: #4a2020; border-color: #6b2a2a; }
  #script-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
  #script-toggle button { flex: 1; }
  #script-toggle button.active { background: #3a6df0; border-color: #3a6df0; color: #fff; }
  #global-fields { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #2a2d33; }
  details.mode-group {
    border: 1px solid #2a2d33; border-radius: 6px; margin-bottom: 8px; padding: 8px 10px;
    background: #17191e;
  }
  details.mode-group[open] { border-color: #3a4050; }
  details.mode-group summary {
    cursor: pointer; font-size: 13px; font-weight: 600; padding: 2px 0; list-style: revert;
  }
  details.mode-group summary::marker { color: #6a7080; }
  .mode-help { font-size: 11px; color: #8890a0; margin: 6px 0 2px; line-height: 1.5; }
  .mode-fields { margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #24272d; }
  th { color: #888; font-weight: 500; }
  .badge { padding: 2px 7px; border-radius: 999px; font-size: 11px; }
  .badge.running { background: #1e3a2a; color: #6bd08a; }
  .badge.finished { background: #24272d; color: #9aa0aa; }
  .badge.failed { background: #3a1e1e; color: #e08080; }
  .badge.stopped { background: #3a331e; color: #e0c280; }
  .progress-cell { min-width: 140px; }
  .progress-bar { height: 5px; background: #24272d; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .progress-bar > div { height: 100%; background: #3a6df0; }
  tr.selected { background: #22262d; }
  #log-panel { margin-top: 14px; }
  #log { background: #0a0b0d; border: 1px solid #2a2d33; border-radius: 6px; padding: 10px;
         height: 360px; overflow-y: auto; white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; }
  #runs-empty { color: #666; padding: 8px 0; }
</style>

<header>
  <h1>Training Ops</h1>
  <p>Local control panel for run_league.py / run_pretrain.py — start, stop, watch logs.</p>
  <a href="/">← Home</a>
  <a href="/replay">Game replay viewer →</a>
</header>

<main>
  <section id="new-run">
    <h2>New run</h2>
    <div id="script-toggle">
      <button id="btn-league" class="active" onclick="setScript('league')">League</button>
      <button id="btn-pretrain" onclick="setScript('pretrain')">Pretrain</button>
    </div>

    <div id="preconfig-row">
      <label for="preconfig">Load preconfiguration (training_configs/) — prefills League-training fields below, still fully editable</label>
      <select id="preconfig" onchange="applyPreconfig(this.value)">
        <option value="">— none —</option>
      </select>
    </div>

    <div id="global-fields"></div>
    <div id="mode-groups"></div>
    <p class="hint" id="deck-hint"></p>
    <datalist id="deck-list"></datalist>

    <button class="primary" onclick="startRun()">Start run</button>
  </section>

  <section id="runs">
    <h2>Runs</h2>
    <table id="runs-table">
      <thead><tr><th>Started</th><th>Type</th><th>Progress</th><th>Timing</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="runs-empty">No runs yet.</p>

    <div id="log-panel" style="display:none">
      <h2 id="log-title">Log</h2>
      <div id="log"></div>
    </div>
  </section>
</main>

<script>
let currentScript = 'league';
let currentSpec = { fields: [], global: [], modes: [] };
let currentMode = null;
let configsByFile = {};
let deckNames = [];
let lastRunsList = [];
let currentEventSource = null;
let currentLogRunId = null;

async function init() {
  deckNames = await (await fetch('/api/decks')).json();
  document.getElementById('deck-list').innerHTML =
    deckNames.map(d => `<option value="${d}">`).join('');
  document.getElementById('deck-hint').textContent = 'Available decks: ' + deckNames.join(', ');

  configsByFile = await (await fetch('/api/configs')).json();
  const sel = document.getElementById('preconfig');
  for (const name of Object.keys(configsByFile)) {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  }

  await loadSpec('league');
  refreshRuns();
  setInterval(refreshRuns, 3000);
}

function setScript(script) {
  currentScript = script;
  document.getElementById('btn-league').classList.toggle('active', script === 'league');
  document.getElementById('btn-pretrain').classList.toggle('active', script === 'pretrain');
  document.getElementById('preconfig-row').style.display = script === 'league' ? '' : 'none';
  loadSpec(script);
}

async function loadSpec(script) {
  currentSpec = await (await fetch(`/api/argspec/${script}`)).json();
  currentMode = currentSpec.modes.length ? currentSpec.modes[0].key : null;
  renderForm();
}

function fieldByDest(dest) {
  return currentSpec.fields.find(f => f.dest === dest);
}

function buildFieldEl(field, scope) {
  const id = `f-${scope}-${field.dest}`;
  const wrap = document.createElement('div');
  if (field.type === 'store_true') {
    wrap.innerHTML = `<label class="checkbox"><input type="checkbox" id="${id}" title="${field.help || ''}"> ${field.flags[0] || field.dest}</label>`;
  } else if (field.type === 'tri_bool') {
    // Unlike store_true, "off" here must be a distinct, submittable state
    // (--no-X), not just "checkbox left unchecked" -- a plain checkbox can
    // only ever omit the flag, which for a default-True flag (e.g. --pfsp)
    // would silently mean "on" regardless of what the user picked. A 3-way
    // select keeps "(default)" (omit the flag entirely), On, and Off distinct.
    wrap.innerHTML = `
      <label title="${field.help || ''}">${field.flags[0] || field.dest}</label>
      <select id="${id}">
        <option value="">(default)</option>
        <option value="true">On (${field.flags[0]})</option>
        <option value="false">Off (${field.flags[1] || '--no-' + field.dest})</option>
      </select>`;
  } else if (field.nargs === 2) {
    wrap.innerHTML = `
      <label title="${field.help || ''}">${field.flags[0] || field.dest}</label>
      <div class="matchup-row">
        <input type="text" id="${id}" list="deck-list" placeholder="${(field.metavar && field.metavar[0]) || 'A'}">
        <input type="text" id="${id}-2" list="deck-list" placeholder="${(field.metavar && field.metavar[1]) || 'B'}">
      </div>`;
  } else {
    const inputType = (field.type === 'int' || field.type === 'float') ? 'number' : 'text';
    const step = field.type === 'float' ? ' step="any"' : '';
    const placeholder = (field.default === null || field.default === undefined || field.default === false)
      ? 'auto' : `default: ${field.default}`;
    wrap.innerHTML = `
      <label title="${field.help || ''}">${field.flags[0] || field.dest}</label>
      <input type="${inputType}"${step} id="${id}" placeholder="${placeholder}">`;
  }
  return wrap;
}

function renderForm() {
  const globalWrap = document.getElementById('global-fields');
  globalWrap.innerHTML = '';
  for (const dest of currentSpec.global) {
    const field = fieldByDest(dest);
    if (field) globalWrap.appendChild(buildFieldEl(field, 'global'));
  }

  const modesWrap = document.getElementById('mode-groups');
  modesWrap.innerHTML = '';
  for (const mode of currentSpec.modes) {
    const details = document.createElement('details');
    details.className = 'mode-group';
    details.dataset.modeKey = mode.key;
    details.open = mode.key === currentMode;

    const summary = document.createElement('summary');
    summary.textContent = mode.label;
    details.appendChild(summary);

    if (mode.help) {
      const p = document.createElement('p');
      p.className = 'mode-help';
      p.textContent = mode.help;
      details.appendChild(p);
    }

    const fieldsDiv = document.createElement('div');
    fieldsDiv.className = 'mode-fields';
    for (const dest of mode.dests) {
      const field = fieldByDest(dest);
      if (field) fieldsDiv.appendChild(buildFieldEl(field, mode.key));
    }
    details.appendChild(fieldsDiv);

    // Accordion: opening one mode closes the others. Guarded on details.open
    // so closing a sibling (which also fires 'toggle') doesn't recurse.
    details.addEventListener('toggle', () => { if (details.open) openMode(mode.key); });
    modesWrap.appendChild(details);
  }
}

function openMode(key) {
  currentMode = key;
  for (const details of document.querySelectorAll('#mode-groups details.mode-group')) {
    details.open = details.dataset.modeKey === key;
  }
}

function setFieldValue(scope, dest, value) {
  const el = document.getElementById(`f-${scope}-${dest}`);
  if (!el) return;
  if (el.type === 'checkbox') el.checked = !!value;
  else el.value = value;
}

function getFieldValue(scope, dest) {
  const el = document.getElementById(`f-${scope}-${dest}`);
  return el ? el.value : '';
}

// games_per_iteration, the PPO batch-size ramp (batch_size_start/cap/steps),
// and max_batch_size used to be mapped here too -- removed 2026-07-31 along
// with their form fields (see webapp/runs.py's LEAGUE_MODES comment).
const CONFIG_KEY_TO_DEST = {
  n_workers: 'n_workers', checkpoint_opponent_rate: 'checkpoint_opponent_rate',
  total_games: 'total_games',
};

function applyPreconfig(filename) {
  if (!filename) return;
  const cfg = configsByFile[filename];
  openMode('league');  // these JSON files are all League-training run-mechanics/identity
  for (const [key, dest] of Object.entries(CONFIG_KEY_TO_DEST)) {
    if (key in cfg) setFieldValue('league', dest, cfg[key]);
  }
  if ('league_name' in cfg) setFieldValue('global', 'league_name', cfg.league_name);
  if ('roster' in cfg) setFieldValue('league', 'roster', cfg.roster.join(','));
  if ('train_decks' in cfg) setFieldValue('league', 'decks', cfg.train_decks.join(','));
  if ('snapshot_every_games' in cfg) {
    // Mirrors run_league.py main()'s own snapshot_every_games -> --snapshot-every
    // (iterations) conversion. games_per_iteration is no longer a form field --
    // run_league.py always derives it as max(1, n_workers), one game per worker --
    // so this replicates that same derivation from whatever n_workers is on screen
    // right now (falls back to the script's own hardcoded default of 6).
    const nWorkers = Number(getFieldValue('league', 'n_workers')) || 6;
    const gpi = Math.max(1, nWorkers);
    setFieldValue('league', 'snapshot_every', Math.max(1, Math.floor(cfg.snapshot_every_games / gpi)));
  }
}

function readFieldValue(field, scope, values) {
  if (field.type === 'store_true') {
    const el = document.getElementById(`f-${scope}-${field.dest}`);
    values[field.dest] = el ? el.checked : false;
  } else if (field.type === 'tri_bool') {
    const el = document.getElementById(`f-${scope}-${field.dest}`);
    const v = el ? el.value : '';
    values[field.dest] = v === '' ? null : v === 'true';
  } else if (field.nargs === 2) {
    const a = getFieldValue(scope, field.dest).trim();
    const bEl = document.getElementById(`f-${scope}-${field.dest}-2`);
    const b = bEl ? bEl.value.trim() : '';
    values[field.dest] = (a && b) ? [a, b] : null;
  } else {
    const v = getFieldValue(scope, field.dest).trim();
    values[field.dest] = v === '' ? null : v;
  }
}

function collectValues() {
  const values = {};
  for (const dest of currentSpec.global) {
    const field = fieldByDest(dest);
    if (field) readFieldValue(field, 'global', values);
  }
  const activeMode = currentSpec.modes.find(m => m.key === currentMode);
  if (activeMode) {
    for (const dest of activeMode.dests) {
      const field = fieldByDest(dest);
      if (field) readFieldValue(field, activeMode.key, values);
    }
    if (activeMode.implies) Object.assign(values, activeMode.implies);
  }
  return values;
}

async function startRun() {
  const active = lastRunsList.filter(r => r.status === 'running');
  if (active.length && !confirm(
    `${active.length} run(s) already active. Training already saturates every CPU core -- ` +
    `starting another will make both slower. Start anyway?`)) return;

  const values = collectValues();
  const res = await fetch('/api/runs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ script: currentScript, args: values }),
  });
  if (!res.ok) { alert('Failed to start run: ' + await res.text()); return; }
  const entry = await res.json();
  await refreshRuns();
  openLog(entry.id);
}

async function refreshRuns() {
  lastRunsList = await (await fetch('/api/runs')).json();
  renderRunsTable();
}

function progressCell(run) {
  if (run.mode !== 'auto_escalate') return '—';
  const pct = Math.min(100, Math.round(100 * run.cumulative_games_per_deck / run.total_games));
  return `<div class="progress-cell">
    ${run.cumulative_games_per_deck}/${run.total_games} games/deck (batch ${run.batches_run})
    <div class="progress-bar"><div style="width:${pct}%"></div></div>
  </div>`;
}

function timingCell(run) {
  // Finest granularity either script actually logs is one "batch" (a full
  // script invocation, or one --eval pass) -- no per-iteration timing exists
  // to show. Reflects the LAST batch to finish, so it updates as an
  // escalating session's later batches complete.
  const t = run.timing;
  if (!t) return run.status === 'running' ? 'waiting on first batch…' : '—';
  const gamesPart = t.games ? ` (${t.games} games)` : '';
  return `${t.avg_seconds_per_game.toFixed(2)}s/game<br>${t.total_seconds.toFixed(1)}s total${gamesPart}`;
}

function renderRunsTable() {
  const tbody = document.querySelector('#runs-table tbody');
  tbody.innerHTML = '';
  document.getElementById('runs-empty').style.display = lastRunsList.length ? 'none' : '';
  for (const run of lastRunsList) {
    const tr = document.createElement('tr');
    if (run.id === currentLogRunId) tr.classList.add('selected');
    const started = new Date(run.started * 1000).toLocaleTimeString();
    const stopBtn = run.status === 'running'
      ? `<button class="danger" onclick="stopRun('${run.id}')">Stop</button>` : '';
    tr.innerHTML = `
      <td>${started}</td>
      <td>${run.script}${run.mode === 'auto_escalate' ? ' (auto)' : ''}</td>
      <td>${progressCell(run)}</td>
      <td>${timingCell(run)}</td>
      <td><span class="badge ${run.status}">${run.status}</span></td>
      <td><button onclick="openLog('${run.id}')">View log</button> ${stopBtn}</td>`;
    tbody.appendChild(tr);
  }
}

async function stopRun(runId) {
  const res = await fetch(`/api/runs/${runId}/stop`, { method: 'POST' });
  const body = await res.json();
  if (!body.stopped) {
    alert(
      "Couldn't stop this run. Most likely cause: the server was restarted after this " +
      "run started, so this process no longer holds a handle to it -- it'll keep " +
      "training to completion untouched. (See the README's Training-ops UI section.)"
    );
  }
  refreshRuns();
}

function openLog(runId) {
  if (currentEventSource) currentEventSource.close();
  currentLogRunId = runId;
  renderRunsTable();
  document.getElementById('log-panel').style.display = '';
  document.getElementById('log-title').textContent = `Log — ${runId}`;
  const logEl = document.getElementById('log');
  logEl.textContent = '';
  const es = new EventSource(`/api/runs/${runId}/log`);
  es.onmessage = (e) => {
    logEl.textContent += JSON.parse(e.data);
    logEl.scrollTop = logEl.scrollHeight;
  };
  es.addEventListener('done', () => es.close());
  es.onerror = () => es.close();
  currentEventSource = es;
}

init();
</script>
