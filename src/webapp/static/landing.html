<title>Pauper Sim</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.4 -apple-system, Segoe UI, sans-serif;
    background: #14161a; color: #d8dbe0;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  main { text-align: center; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p.sub { margin: 0 0 32px; color: #888; font-size: 13px; }
  .cards { display: flex; gap: 16px; }
  a.card {
    display: block; width: 220px; padding: 24px 18px; text-decoration: none; color: #d8dbe0;
    background: #1b1e24; border: 1px solid #2a2d33; border-radius: 10px; transition: border-color .15s, background .15s;
  }
  a.card:hover { border-color: #3a6df0; background: #1e222a; }
  a.card .icon { font-size: 28px; margin-bottom: 10px; }
  a.card h2 { margin: 0 0 6px; font-size: 15px; color: #e8eaf0; }
  a.card p { margin: 0; font-size: 12px; color: #888; }
</style>

<main>
  <h1>Pauper Sim</h1>
  <p class="sub">MTG engine + RL training harness</p>
  <div class="cards">
    <a class="card" href="/train">
      <div class="icon">&#9881;&#65039;</div>
      <h2>Training harness</h2>
      <p>Start, stop, and monitor run_league.py / run_pretrain.py sessions.</p>
    </a>
    <a class="card" href="/replay">
      <div class="icon">&#127918;</div>
      <h2>Game replay</h2>
      <p>Step through a logged game's board state, event by event.</p>
    </a>
  </div>
</main>
