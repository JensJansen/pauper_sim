<title>Game Replay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.4 -apple-system, Segoe UI, sans-serif;
    background: #14161a; color: #d8dbe0;
  }
  header { padding: 14px 20px; border-bottom: 1px solid #2a2d33; display: flex; align-items: baseline; gap: 16px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 0; color: #888; font-size: 12px; }
  header a { color: #6a9dff; text-decoration: none; margin-left: auto; font-size: 12px; }
  header a:hover { text-decoration: underline; }
  main { padding: 16px 20px; }
  section { background: #1b1e24; border: 1px solid #2a2d33; border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #9aa0aa; }
  button {
    cursor: pointer; border: 1px solid #3a3f47; border-radius: 5px; background: #262a31;
    color: #e8eaf0; padding: 6px 12px; font-size: 12px;
  }
  button:hover { background: #2f343c; }
  button:disabled { opacity: .4; cursor: default; }
  select { padding: 6px 8px; background: #0e1013; border: 1px solid #34383f; border-radius: 5px; color: #e8eaf0; font-size: 13px; }
  .hint { color: #666; font-size: 12px; }
  #controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #scrubber { flex: 1; min-width: 200px; }
  #step-desc { font-size: 15px; margin: 10px 0 2px; }
  #turn-phase { color: #8890a0; font-size: 12px; }
  .board { display: grid; grid-template-columns: 1fr 220px 1fr; gap: 14px; align-items: start; }
  .player-col { background: #1b1e24; border: 1px solid #2a2d33; border-radius: 8px; padding: 12px; }
  .player-col h3 { margin: 0 0 8px; font-size: 13px; }
  .player-col h3 .life { color: #e08a8a; font-weight: 700; }
  .mana-pool { margin-bottom: 8px; }
  .mana-badge { display: inline-block; background: #262a31; border: 1px solid #3a3f47; border-radius: 4px; padding: 1px 6px; margin: 0 3px 3px 0; font-size: 11px; }
  .zone-label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #777; margin: 8px 0 4px; }
  .zone-row { display: flex; flex-wrap: wrap; gap: 5px; min-height: 78px; }
  .card-thumb {
    width: 56px; height: 78px; border-radius: 5px; overflow: hidden; position: relative;
    background: #0e1013; border: 1px solid #34383f; flex-shrink: 0;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb.tapped { opacity: .55; border-color: #e0c280; }
  .card-thumb.attacking { border-color: #e08080; box-shadow: 0 0 0 1px #e08080; }
  .card-thumb.blocking { border-color: #6a9dff; box-shadow: 0 0 0 1px #6a9dff; }
  .card-fallback {
    width: 100%; height: 100%; align-items: center; justify-content: center; text-align: center;
    font-size: 9px; padding: 2px; color: #aab;
  }
  .card-thumb .pt {
    position: absolute; right: 1px; bottom: 1px; background: #0009; color: #fff;
    font-size: 9px; padding: 0 3px; border-radius: 3px;
  }
  .card-thumb .token-badge {
    position: absolute; left: 1px; top: 1px; background: #3a6df0; color: #fff;
    font-size: 8px; padding: 0 3px; border-radius: 3px;
  }
  .stack-col { background: #1b1e24; border: 1px solid #2a2d33; border-radius: 8px; padding: 12px; min-height: 200px; }
  .stack-col h3 { margin: 0 0 8px; font-size: 13px; }
  .stack-entry { background: #262a31; border: 1px solid #3a3f47; border-radius: 5px; padding: 4px 7px; margin-bottom: 4px; font-size: 12px; }
  details summary { cursor: pointer; color: #aab; font-size: 12px; }
  #file-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>

<header>
  <h1>Game Replay</h1>
  <p>Step through a logged game's board state, event by event.</p>
  <a href="/">← Training Ops</a>
</header>

<main>
  <section id="picker">
    <h2>Load a game</h2>
    <div id="file-row">
      <input type="file" id="file-input" accept=".json">
      <select id="game-picker" disabled><option value="">— load a log file first —</option></select>
      <span class="hint" id="file-hint"></span>
    </div>
  </section>

  <section id="scrub-panel" style="display:none">
    <div id="controls">
      <button id="btn-prev">◀</button>
      <input type="range" id="scrubber" min="0" max="0" value="0">
      <button id="btn-next">▶</button>
      <span id="step-counter" class="hint"></span>
    </div>
    <div id="step-desc"></div>
    <div id="turn-phase"></div>
  </section>

  <div class="board" id="board" style="display:none">
    <div class="player-col" id="player-0">
      <h3>Player 0 — <span class="life">20</span> life</h3>
      <div class="mana-pool"></div>
      <div class="zone-label">Hand</div>
      <div class="zone-row hand"></div>
      <div class="zone-label">Creatures</div>
      <div class="zone-row bf-creatures"></div>
      <div class="zone-label">Lands</div>
      <div class="zone-row bf-lands"></div>
      <div class="zone-label">Other permanents</div>
      <div class="zone-row bf-other"></div>
      <div class="zone-label">Graveyard</div>
      <div class="graveyard"></div>
      <div class="zone-label">Exile</div>
      <div class="exile"></div>
    </div>

    <div class="stack-col">
      <h3>Stack</h3>
      <div id="stack-list"></div>
    </div>

    <div class="player-col" id="player-1">
      <h3>Player 1 — <span class="life">20</span> life</h3>
      <div class="mana-pool"></div>
      <div class="zone-label">Hand</div>
      <div class="zone-row hand"></div>
      <div class="zone-label">Creatures</div>
      <div class="zone-row bf-creatures"></div>
      <div class="zone-label">Lands</div>
      <div class="zone-row bf-lands"></div>
      <div class="zone-label">Other permanents</div>
      <div class="zone-row bf-other"></div>
      <div class="zone-label">Graveyard</div>
      <div class="graveyard"></div>
      <div class="zone-label">Exile</div>
      <div class="exile"></div>
    </div>
  </div>
</main>

<script>
let fileContent = null;
let currentSteps = null;
let currentIndex = 0;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Hotlinked directly from Scryfall's own image-redirect endpoint -- no local
// caching/storage, nothing committed to the repo. Fine for a local,
// single-user viewer with a handful of concurrent image requests per step.
function scryfallImgUrl(name) {
  return `https://api.scryfall.com/cards/named?format=image&version=small&fuzzy=${encodeURIComponent(name)}`;
}

function cardThumb(name, opts) {
  opts = opts || {};
  const cls = ['card-thumb', opts.tapped && 'tapped', opts.attacking && 'attacking', opts.blocking && 'blocking']
    .filter(Boolean).join(' ');
  const pt = (opts.power != null && opts.toughness != null) ? `<div class="pt">${opts.power}/${opts.toughness}</div>` : '';
  const tokenBadge = opts.is_token ? '<div class="token-badge">T</div>' : '';
  return `
    <div class="${cls}" title="${escapeHtml(name)}">
      <img src="${scryfallImgUrl(name)}" loading="lazy"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="card-fallback" style="display:none">${escapeHtml(name)}</div>
      ${pt}${tokenBadge}
    </div>`;
}

function zoneSummary(cards) {
  if (!cards.length) return '<span class="hint">empty</span>';
  return `<details><summary>${cards.length} card${cards.length === 1 ? '' : 's'}</summary>${cards.map(escapeHtml).join(', ')}</details>`;
}

function renderBoard(step) {
  for (const idx of [0, 1]) {
    const p = step.players[idx];
    const col = document.getElementById(`player-${idx}`);
    col.querySelector('.life').textContent = p.life;
    const manaEntries = Object.entries(p.mana_pool).filter(([, n]) => n > 0);
    col.querySelector('.mana-pool').innerHTML = manaEntries.length
      ? manaEntries.map(([c, n]) => `<span class="mana-badge">${escapeHtml(c)}: ${n}</span>`).join('')
      : '<span class="hint">no mana in pool</span>';
    col.querySelector('.hand').innerHTML = p.hand.length
      ? p.hand.map(n => cardThumb(n, {})).join('') : '<span class="hint">empty</span>';

    const bf = p.battlefield;
    const isLand = c => c.card_type === 'LAND';
    const isCreature = c => c.card_type === 'CREATURE' || (c.card_type == null && c.power != null);
    const creatures = bf.filter(isCreature);
    const lands = bf.filter(c => isLand(c) && !isCreature(c));
    const other = bf.filter(c => !isLand(c) && !isCreature(c));
    col.querySelector('.bf-creatures').innerHTML = creatures.map(c => cardThumb(c.name, c)).join('') || '<span class="hint">—</span>';
    col.querySelector('.bf-lands').innerHTML = lands.map(c => cardThumb(c.name, c)).join('') || '<span class="hint">—</span>';
    col.querySelector('.bf-other').innerHTML = other.map(c => cardThumb(c.name, c)).join('') || '<span class="hint">—</span>';

    col.querySelector('.graveyard').innerHTML = zoneSummary(p.graveyard);
    col.querySelector('.exile').innerHTML = zoneSummary(p.exile);
  }

  const stack = [...step.stack].reverse();  // top of stack first
  document.getElementById('stack-list').innerHTML = stack.length
    ? stack.map(c => `<div class="stack-entry">${escapeHtml(c.name)} <span class="hint">(P${c.controller})</span></div>`).join('')
    : '<span class="hint">empty</span>';
}

function renderStep(i) {
  currentIndex = i;
  const step = currentSteps[i];
  document.getElementById('scrubber').value = i;
  document.getElementById('step-counter').textContent = `Step ${i + 1} / ${currentSteps.length}`;
  document.getElementById('step-desc').textContent = step.description;
  document.getElementById('turn-phase').textContent =
    `Turn ${step.turn ?? '?'}${step.phase ? ' — ' + step.phase.replace(/_/g, ' ') : ''}`;
  document.getElementById('btn-prev').disabled = i === 0;
  document.getElementById('btn-next').disabled = i === currentSteps.length - 1;
  renderBoard(step);
}

async function postJson(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function onFile(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  document.getElementById('file-hint').textContent = 'parsing…';
  try {
    fileContent = await file.text();
    const data = await postJson('/api/replay/games', { content: fileContent });
    const sel = document.getElementById('game-picker');
    sel.innerHTML = '<option value="">— pick a game —</option>' +
      data.games.map(g => `<option value="${g.game_index}">${escapeHtml(g.label)}</option>`).join('');
    sel.disabled = data.games.length === 0;
    document.getElementById('file-hint').textContent = `${file.name}: ${data.games.length} game(s)`;
  } catch (err) {
    document.getElementById('file-hint').textContent = '';
    alert('Failed to load log: ' + err.message);
  }
}

async function onGameChange(ev) {
  const gameIndex = Number(ev.target.value);
  if (Number.isNaN(gameIndex) || ev.target.value === '') return;
  try {
    const data = await postJson('/api/replay/game', { content: fileContent, game_index: gameIndex });
    currentSteps = data.steps;
    document.getElementById('scrubber').max = Math.max(0, currentSteps.length - 1);
    document.getElementById('scrub-panel').style.display = '';
    document.getElementById('board').style.display = '';
    renderStep(0);
  } catch (err) {
    alert('Failed to load game: ' + err.message);
  }
}

document.getElementById('file-input').addEventListener('change', onFile);
document.getElementById('game-picker').addEventListener('change', onGameChange);
document.getElementById('scrubber').addEventListener('input', e => renderStep(Number(e.target.value)));
document.getElementById('btn-prev').addEventListener('click', () => { if (currentIndex > 0) renderStep(currentIndex - 1); });
document.getElementById('btn-next').addEventListener('click', () => { if (currentSteps && currentIndex < currentSteps.length - 1) renderStep(currentIndex + 1); });
document.addEventListener('keydown', e => {
  if (!currentSteps) return;
  if (e.key === 'ArrowLeft' && currentIndex > 0) { e.preventDefault(); renderStep(currentIndex - 1); }
  if (e.key === 'ArrowRight' && currentIndex < currentSteps.length - 1) { e.preventDefault(); renderStep(currentIndex + 1); }
});
</script>
